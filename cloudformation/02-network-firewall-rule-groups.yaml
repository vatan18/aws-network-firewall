AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  02 - AWS Network Firewall rule groups (STRICT_ORDER): stateless baseline, IP denylist,
  domain denylist/allowlist, SSH/RDP restriction, DNS security and sample IPS signatures.
  Rule order and capacity are immutable after creation; size capacity deliberately.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming and tagging }
        Parameters: [ProjectName, Environment, Owner, CostCenter]
      - Label: { default: Policy inputs }
        Parameters: [DomainAllowlist, DomainDenylist, BlockedIpCidrs, AdminAllowedCidrs, SshEgressAllowedCidrs, AllowedDnsResolverCidrs]
      - Label: { default: Capacity (immutable) }
        Parameters: [StatelessCapacity, DomainListCapacity, SuricataCapacity]
      - Label: { default: Options }
        Parameters: [EnableStatelessBaseline, BlockQuic]
      - Label: { default: Egress control }
        Parameters: [EgressMode, EgressAllowedTcpPorts, EgressAllowedUdpPorts, EgressAllowedDestinationCidrs]
      - Label: { default: Ingress control }
        Parameters: [IngressMode, IngressAllowedSourceCidrs, IngressAllowedTcpPorts, IngressAllowedUdpPorts]
      - Label: { default: East-west control }
        Parameters: [EastWestMode, EastWestAllowedTcpPorts]
      - Label: { default: Application presets }
        Parameters: [PresetGoogle, PresetYouTube, PresetFacebook, PresetInstagram, PresetWhatsApp, PresetX, PresetLinkedIn, PresetTikTok, PresetMicrosoft365, PresetNetflix]

Parameters:
  ProjectName:
    Type: String
    Default: anfw
    Description: Short project prefix used in resource names.
    AllowedPattern: '^[a-z][a-z0-9-]{1,14}$'
  Environment:
    Type: String
    Default: poc
    AllowedValues: [poc, dev, stg, prod]
    Description: Deployment environment.
  Owner:
    Type: String
    Default: platform-team
    Description: Owner tag value.
    AllowedPattern: '^[A-Za-z0-9 ._@:/=+-]{1,128}$'
  CostCenter:
    Type: String
    Default: infra-security
    Description: CostCenter tag value.
    AllowedPattern: '^[A-Za-z0-9 ._@:/=+-]{1,128}$'
  DomainAllowlist:
    Type: CommaDelimitedList
    Default: ".amazonaws.com,.github.com,.githubusercontent.com,.docker.io,.docker.com,registry.k8s.io,.ubuntu.com"
    Description: >-
      Approved egress domains (HTTP Host and TLS SNI). A leading dot matches the domain and its subdomains.
      Anything not matched falls to the policy default action.
    AllowedPattern: '^[.a-zA-Z0-9,_-]+$'
  DomainDenylist:
    Type: CommaDelimitedList
    Default: ".wicar.org,.eicar.org"
    Description: Domains always blocked (defaults are anti-malware test domains for POC validation).
    AllowedPattern: '^[.a-zA-Z0-9,_-]+$'
  BlockedIpCidrs:
    Type: CommaDelimitedList
    Default: "192.0.2.0/24"
    Description: IPv4 CIDRs blocked in both directions. Default is TEST-NET-1, a safe placeholder.
    AllowedPattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  AdminAllowedCidrs:
    Type: CommaDelimitedList
    Default: "198.51.100.0/24"
    Description: >-
      Sources allowed to reach SSH (22) and RDP (3389) on HOME_NET. All other SSH/RDP is denied.
      Default is TEST-NET-2 (nothing allowed). Set to bastion or VPN CIDRs. Prefer SSM Session Manager.
    AllowedPattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  SshEgressAllowedCidrs:
    Type: CommaDelimitedList
    Default: "203.0.113.0/24"
    Description: Destinations workloads may reach on TCP 22 (for example Git over SSH). Default is TEST-NET-3.
    AllowedPattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  AllowedDnsResolverCidrs:
    Type: CommaDelimitedList
    Default: "10.0.0.2/32"
    Description: >-
      External or custom DNS resolvers workloads may use on port 53. Queries to the Amazon-provided
      resolver (VPC base+2) never traverse the firewall, so they are unaffected by these rules.
    AllowedPattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  StatelessCapacity:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 30000
    Description: Capacity of the stateless baseline group (immutable).
  DomainListCapacity:
    Type: Number
    Default: 200
    MinValue: 10
    MaxValue: 30000
    Description: Capacity for each domain list group; at least the number of domains (immutable).
  SuricataCapacity:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 30000
    Description: Capacity for each Suricata rule group (immutable). Rules with IP/port lists consume more.
  EnableStatelessBaseline:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the stateless baseline that drops Telnet, TFTP, RPC/NetBIOS and SMB ports.

  PresetGoogle:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Google preset (.google.com, .google.co.in, .gstatic.com, .googleusercontent.com). none = no rule, allow = permit, block = deny."
  PresetYouTube:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "YouTube preset (.youtube.com, .youtu.be, .googlevideo.com, .ytimg.com, .youtube-nocookie.com). none = no rule, allow = permit, block = deny."
  PresetFacebook:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Facebook preset (.facebook.com, .facebook.net, .fbcdn.net, .fb.com, .fbsbx.com). none = no rule, allow = permit, block = deny."
  PresetInstagram:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Instagram preset (.instagram.com, .cdninstagram.com). none = no rule, allow = permit, block = deny."
  PresetWhatsApp:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "WhatsApp preset (.whatsapp.com, .whatsapp.net). none = no rule, allow = permit, block = deny."
  PresetX:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "X preset (.twitter.com, .x.com, .twimg.com, .t.co). none = no rule, allow = permit, block = deny."
  PresetLinkedIn:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "LinkedIn preset (.linkedin.com, .licdn.com). none = no rule, allow = permit, block = deny."
  PresetTikTok:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "TikTok preset (.tiktok.com, .tiktokcdn.com, .tiktokv.com, .byteoversea.com). none = no rule, allow = permit, block = deny."
  PresetMicrosoft365:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Microsoft365 preset (.microsoft.com, .office.com, .office365.com, .microsoftonline.com, .live.com, .sharepoint.com, .outlook.com). none = no rule, allow = permit, block = deny."
  PresetNetflix:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Netflix preset (.netflix.com, .nflxvideo.net, .nflximg.net, .nflxso.net, .nflxext.com). none = no rule, allow = permit, block = deny."
  BlockQuic:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Drop outbound UDP 443 (QUIC/HTTP3). Network Firewall cannot read the domain inside QUIC, so without this
      Chrome, YouTube and Google traffic can bypass domain rules. Blocking it makes clients fall back to TCP/TLS.
  EgressMode:
    Type: String
    Default: allowlist
    AllowedValues: [allowlist, open]
    Description: >-
      allowlist = outbound is denied unless a domain, port or CIDR rule allows it. open = outbound is allowed
      except what the denylists and blocked presets stop. Must match template 03.
  EgressAllowedTcpPorts:
    Type: CommaDelimitedList
    Default: ""
    Description: Outbound TCP ports allowed to ANY destination, bypassing domain rules (for example 25,587,5432). Empty = none.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'
  EgressAllowedUdpPorts:
    Type: CommaDelimitedList
    Default: "123"
    Description: Outbound UDP ports allowed to any destination (default NTP). Empty = none.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'
  EgressAllowedDestinationCidrs:
    Type: CommaDelimitedList
    Default: ""
    Description: Destination CIDRs workloads may reach on any port (partner or on-prem ranges). Empty = none.
    AllowedPattern: '^$|^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  IngressMode:
    Type: String
    Default: restricted
    AllowedValues: [restricted, open]
    Description: restricted = only the sources and ports below are allowed inbound. open = all inbound allowed after threat checks.
  IngressAllowedSourceCidrs:
    Type: CommaDelimitedList
    Default: "0.0.0.0/0"
    Description: Sources allowed inbound on the ports below (0.0.0.0/0 = internet).
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  IngressAllowedTcpPorts:
    Type: CommaDelimitedList
    Default: "80,443"
    Description: Inbound TCP ports allowed (ranges as 8000:8100). Empty = none.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'
  IngressAllowedUdpPorts:
    Type: CommaDelimitedList
    Default: ""
    Description: Inbound UDP ports allowed. Empty = none.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'
  EastWestMode:
    Type: String
    Default: allow-all
    AllowedValues: [allow-all, ports-only]
    Description: Traffic between HOME_NET addresses. allow-all = permit (threat rules still apply). ports-only = permit only the TCP ports below.
  EastWestAllowedTcpPorts:
    Type: CommaDelimitedList
    Default: ""
    Description: East-west TCP ports allowed when EastWestMode is ports-only.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'

Conditions:
  CreateStatelessBaseline: !Equals [!Ref EnableStatelessBaseline, "true"]
  GoogleAllow: !Equals [!Ref PresetGoogle, allow]
  GoogleBlock: !Equals [!Ref PresetGoogle, block]
  YouTubeAllow: !Equals [!Ref PresetYouTube, allow]
  YouTubeBlock: !Equals [!Ref PresetYouTube, block]
  FacebookAllow: !Equals [!Ref PresetFacebook, allow]
  FacebookBlock: !Equals [!Ref PresetFacebook, block]
  InstagramAllow: !Equals [!Ref PresetInstagram, allow]
  InstagramBlock: !Equals [!Ref PresetInstagram, block]
  WhatsAppAllow: !Equals [!Ref PresetWhatsApp, allow]
  WhatsAppBlock: !Equals [!Ref PresetWhatsApp, block]
  XAllow: !Equals [!Ref PresetX, allow]
  XBlock: !Equals [!Ref PresetX, block]
  LinkedInAllow: !Equals [!Ref PresetLinkedIn, allow]
  LinkedInBlock: !Equals [!Ref PresetLinkedIn, block]
  TikTokAllow: !Equals [!Ref PresetTikTok, allow]
  TikTokBlock: !Equals [!Ref PresetTikTok, block]
  Microsoft365Allow: !Equals [!Ref PresetMicrosoft365, allow]
  Microsoft365Block: !Equals [!Ref PresetMicrosoft365, block]
  NetflixAllow: !Equals [!Ref PresetNetflix, allow]
  NetflixBlock: !Equals [!Ref PresetNetflix, block]
  BlockQuicOn: !Equals [!Ref BlockQuic, "true"]
  EgressOpen: !Equals [!Ref EgressMode, open]
  IngressOpen: !Equals [!Ref IngressMode, open]
  ApplyIngressDrop: !And [!Condition EgressOpen, !Not [!Condition IngressOpen]]
  HasIngressTcp: !Not [!Equals [!Join ["", !Ref IngressAllowedTcpPorts], ""]]
  HasIngressUdp: !Not [!Equals [!Join ["", !Ref IngressAllowedUdpPorts], ""]]
  HasEgressTcp: !Not [!Equals [!Join ["", !Ref EgressAllowedTcpPorts], ""]]
  HasEgressUdp: !Not [!Equals [!Join ["", !Ref EgressAllowedUdpPorts], ""]]
  HasEgressCidrs: !Not [!Equals [!Join ["", !Ref EgressAllowedDestinationCidrs], ""]]
  EastWestAllowAll: !Equals [!Ref EastWestMode, allow-all]
  EastWestPortsOnly: !And
    - !Equals [!Ref EastWestMode, ports-only]
    - !Not [!Equals [!Join ["", !Ref EastWestAllowedTcpPorts], ""]]

Resources:
  StatelessBaselineRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Condition: CreateStatelessBaseline
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sl-baseline"
      Description: Drop legacy and lateral-movement protocols before the stateful engine.
      Type: STATELESS
      Capacity: !Ref StatelessCapacity
      RuleGroup:
        RulesSource:
          StatelessRulesAndCustomActions:
            StatelessRules:
              - Priority: 10
                RuleDefinition:
                  MatchAttributes:
                    Sources: [{ AddressDefinition: "0.0.0.0/0" }]
                    Destinations: [{ AddressDefinition: "0.0.0.0/0" }]
                    Protocols: [6, 17]
                    DestinationPorts:
                      - { FromPort: 23, ToPort: 23 }
                      - { FromPort: 69, ToPort: 69 }
                      - { FromPort: 135, ToPort: 139 }
                      - { FromPort: 445, ToPort: 445 }
                  Actions: ["aws:drop"]
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  IpDenylistRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sf-ip-denylist"
      Description: Block known unwanted IPs in both directions.
      Type: STATEFUL
      Capacity: !Ref SuricataCapacity
      RuleGroup:
        RuleVariables:
          IPSets:
            BLOCKED_IPS:
              Definition: !Ref BlockedIpCidrs
        RulesSource:
          RulesString: |
            drop ip any any -> $BLOCKED_IPS any (msg:"anfw: traffic to blocked IP"; sid:1000001; rev:1;)
            drop ip $BLOCKED_IPS any -> any any (msg:"anfw: traffic from blocked IP"; sid:1000002; rev:1;)
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  DomainDenylistRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sf-domain-denylist"
      Description: Block malicious or unwanted domains (HTTP Host and TLS SNI).
      Type: STATEFUL
      Capacity: !Ref DomainListCapacity
      RuleGroup:
        RulesSource:
          RulesSourceList:
            GeneratedRulesType: DENYLIST
            TargetTypes: [HTTP_HOST, TLS_SNI]
            Targets: !Ref DomainDenylist
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  DomainAllowlistRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sf-domain-allowlist"
      Description: Approved egress domains. Evaluated last; the policy default action handles everything else.
      Type: STATEFUL
      Capacity: !Ref DomainListCapacity
      RuleGroup:
        RulesSource:
          RulesSourceList:
            GeneratedRulesType: ALLOWLIST
            TargetTypes: [HTTP_HOST, TLS_SNI]
            Targets: !Ref DomainAllowlist
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  AdminAccessRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sf-admin-access"
      Description: Restrict SSH and RDP to approved sources and destinations.
      Type: STATEFUL
      Capacity: !Ref SuricataCapacity
      RuleGroup:
        RuleVariables:
          IPSets:
            ADMIN_CIDRS:
              Definition: !Ref AdminAllowedCidrs
            SSH_EGRESS_DESTS:
              Definition: !Ref SshEgressAllowedCidrs
        RulesSource:
          RulesString: |
            pass tcp $ADMIN_CIDRS any -> $HOME_NET [22,3389] (msg:"anfw: admin SSH/RDP allowed"; flow:to_server; sid:1000101; rev:1;)
            pass tcp $HOME_NET any -> $SSH_EGRESS_DESTS 22 (msg:"anfw: approved SSH egress"; flow:to_server; sid:1000102; rev:1;)
            drop tcp any any -> any [22,3389] (msg:"anfw: SSH/RDP denied"; flow:to_server; sid:1000103; rev:1;)
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  DnsSecurityRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sf-dns-security"
      Description: Allow DNS only to approved resolvers and block DNS-over-TLS.
      Type: STATEFUL
      Capacity: !Ref SuricataCapacity
      RuleGroup:
        RuleVariables:
          IPSets:
            ALLOWED_DNS_RESOLVERS:
              Definition: !Ref AllowedDnsResolverCidrs
        RulesSource:
          RulesString: |
            pass udp $HOME_NET any -> $ALLOWED_DNS_RESOLVERS 53 (msg:"anfw: approved DNS resolver (udp)"; sid:1000201; rev:1;)
            pass tcp $HOME_NET any -> $ALLOWED_DNS_RESOLVERS 53 (msg:"anfw: approved DNS resolver (tcp)"; flow:to_server; sid:1000202; rev:1;)
            drop udp $HOME_NET any -> any 53 (msg:"anfw: DNS to unapproved resolver (udp)"; sid:1000203; rev:1;)
            drop tcp $HOME_NET any -> any 53 (msg:"anfw: DNS to unapproved resolver (tcp)"; flow:to_server; sid:1000204; rev:1;)
            drop tcp $HOME_NET any -> any 853 (msg:"anfw: DNS-over-TLS blocked"; flow:to_server; sid:1000205; rev:1;)
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  IpsSignaturesRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sf-ips-custom"
      Description: Sample custom IPS/IDS signatures (HTTP and TLS). Extend with your own Suricata rules.
      Type: STATEFUL
      Capacity: !Ref SuricataCapacity
      RuleGroup:
        RulesSource:
          RulesString: |
            drop http $HOME_NET any -> any any (msg:"anfw: scanner user-agent sqlmap"; http.user_agent; content:"sqlmap"; nocase; flow:to_server,established; sid:1000301; rev:1;)
            drop http any any -> $HOME_NET any (msg:"anfw: path traversal in URI"; http.uri; content:"../"; flow:to_server,established; sid:1000302; rev:1;)
            alert tls $HOME_NET any -> any any (msg:"anfw: TLS to .top TLD (visibility only)"; tls.sni; content:".top"; nocase; endswith; flow:to_server,established; sid:1000303; rev:1;)
            alert http $HOME_NET any -> any any (msg:"anfw: cleartext HTTP egress (visibility only)"; flow:to_server,established; sid:1000304; rev:1;)
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  PresetAllowRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sf-preset-allow"
      Description: Domains of application presets set to allow (Google, YouTube, Facebook and so on).
      Type: STATEFUL
      Capacity: !Ref DomainListCapacity
      RuleGroup:
        RulesSource:
          RulesSourceList:
            GeneratedRulesType: ALLOWLIST
            TargetTypes: [HTTP_HOST, TLS_SNI]
            Targets:
              - ".placeholder.invalid"
              - !If [GoogleAllow, ".google.com", !Ref "AWS::NoValue"]
              - !If [GoogleAllow, ".google.co.in", !Ref "AWS::NoValue"]
              - !If [GoogleAllow, ".gstatic.com", !Ref "AWS::NoValue"]
              - !If [GoogleAllow, ".googleusercontent.com", !Ref "AWS::NoValue"]
              - !If [YouTubeAllow, ".youtube.com", !Ref "AWS::NoValue"]
              - !If [YouTubeAllow, ".youtu.be", !Ref "AWS::NoValue"]
              - !If [YouTubeAllow, ".googlevideo.com", !Ref "AWS::NoValue"]
              - !If [YouTubeAllow, ".ytimg.com", !Ref "AWS::NoValue"]
              - !If [YouTubeAllow, ".youtube-nocookie.com", !Ref "AWS::NoValue"]
              - !If [FacebookAllow, ".facebook.com", !Ref "AWS::NoValue"]
              - !If [FacebookAllow, ".facebook.net", !Ref "AWS::NoValue"]
              - !If [FacebookAllow, ".fbcdn.net", !Ref "AWS::NoValue"]
              - !If [FacebookAllow, ".fb.com", !Ref "AWS::NoValue"]
              - !If [FacebookAllow, ".fbsbx.com", !Ref "AWS::NoValue"]
              - !If [InstagramAllow, ".instagram.com", !Ref "AWS::NoValue"]
              - !If [InstagramAllow, ".cdninstagram.com", !Ref "AWS::NoValue"]
              - !If [WhatsAppAllow, ".whatsapp.com", !Ref "AWS::NoValue"]
              - !If [WhatsAppAllow, ".whatsapp.net", !Ref "AWS::NoValue"]
              - !If [XAllow, ".twitter.com", !Ref "AWS::NoValue"]
              - !If [XAllow, ".x.com", !Ref "AWS::NoValue"]
              - !If [XAllow, ".twimg.com", !Ref "AWS::NoValue"]
              - !If [XAllow, ".t.co", !Ref "AWS::NoValue"]
              - !If [LinkedInAllow, ".linkedin.com", !Ref "AWS::NoValue"]
              - !If [LinkedInAllow, ".licdn.com", !Ref "AWS::NoValue"]
              - !If [TikTokAllow, ".tiktok.com", !Ref "AWS::NoValue"]
              - !If [TikTokAllow, ".tiktokcdn.com", !Ref "AWS::NoValue"]
              - !If [TikTokAllow, ".tiktokv.com", !Ref "AWS::NoValue"]
              - !If [TikTokAllow, ".byteoversea.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Allow, ".microsoft.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Allow, ".office.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Allow, ".office365.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Allow, ".microsoftonline.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Allow, ".live.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Allow, ".sharepoint.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Allow, ".outlook.com", !Ref "AWS::NoValue"]
              - !If [NetflixAllow, ".netflix.com", !Ref "AWS::NoValue"]
              - !If [NetflixAllow, ".nflxvideo.net", !Ref "AWS::NoValue"]
              - !If [NetflixAllow, ".nflximg.net", !Ref "AWS::NoValue"]
              - !If [NetflixAllow, ".nflxso.net", !Ref "AWS::NoValue"]
              - !If [NetflixAllow, ".nflxext.com", !Ref "AWS::NoValue"]
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  PresetBlockRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sf-preset-block"
      Description: Domains of application presets set to block.
      Type: STATEFUL
      Capacity: !Ref DomainListCapacity
      RuleGroup:
        RulesSource:
          RulesSourceList:
            GeneratedRulesType: DENYLIST
            TargetTypes: [HTTP_HOST, TLS_SNI]
            Targets:
              - ".placeholder.invalid"
              - !If [GoogleBlock, ".google.com", !Ref "AWS::NoValue"]
              - !If [GoogleBlock, ".google.co.in", !Ref "AWS::NoValue"]
              - !If [GoogleBlock, ".gstatic.com", !Ref "AWS::NoValue"]
              - !If [GoogleBlock, ".googleusercontent.com", !Ref "AWS::NoValue"]
              - !If [YouTubeBlock, ".youtube.com", !Ref "AWS::NoValue"]
              - !If [YouTubeBlock, ".youtu.be", !Ref "AWS::NoValue"]
              - !If [YouTubeBlock, ".googlevideo.com", !Ref "AWS::NoValue"]
              - !If [YouTubeBlock, ".ytimg.com", !Ref "AWS::NoValue"]
              - !If [YouTubeBlock, ".youtube-nocookie.com", !Ref "AWS::NoValue"]
              - !If [FacebookBlock, ".facebook.com", !Ref "AWS::NoValue"]
              - !If [FacebookBlock, ".facebook.net", !Ref "AWS::NoValue"]
              - !If [FacebookBlock, ".fbcdn.net", !Ref "AWS::NoValue"]
              - !If [FacebookBlock, ".fb.com", !Ref "AWS::NoValue"]
              - !If [FacebookBlock, ".fbsbx.com", !Ref "AWS::NoValue"]
              - !If [InstagramBlock, ".instagram.com", !Ref "AWS::NoValue"]
              - !If [InstagramBlock, ".cdninstagram.com", !Ref "AWS::NoValue"]
              - !If [WhatsAppBlock, ".whatsapp.com", !Ref "AWS::NoValue"]
              - !If [WhatsAppBlock, ".whatsapp.net", !Ref "AWS::NoValue"]
              - !If [XBlock, ".twitter.com", !Ref "AWS::NoValue"]
              - !If [XBlock, ".x.com", !Ref "AWS::NoValue"]
              - !If [XBlock, ".twimg.com", !Ref "AWS::NoValue"]
              - !If [XBlock, ".t.co", !Ref "AWS::NoValue"]
              - !If [LinkedInBlock, ".linkedin.com", !Ref "AWS::NoValue"]
              - !If [LinkedInBlock, ".licdn.com", !Ref "AWS::NoValue"]
              - !If [TikTokBlock, ".tiktok.com", !Ref "AWS::NoValue"]
              - !If [TikTokBlock, ".tiktokcdn.com", !Ref "AWS::NoValue"]
              - !If [TikTokBlock, ".tiktokv.com", !Ref "AWS::NoValue"]
              - !If [TikTokBlock, ".byteoversea.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Block, ".microsoft.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Block, ".office.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Block, ".office365.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Block, ".microsoftonline.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Block, ".live.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Block, ".sharepoint.com", !Ref "AWS::NoValue"]
              - !If [Microsoft365Block, ".outlook.com", !Ref "AWS::NoValue"]
              - !If [NetflixBlock, ".netflix.com", !Ref "AWS::NoValue"]
              - !If [NetflixBlock, ".nflxvideo.net", !Ref "AWS::NoValue"]
              - !If [NetflixBlock, ".nflximg.net", !Ref "AWS::NoValue"]
              - !If [NetflixBlock, ".nflxso.net", !Ref "AWS::NoValue"]
