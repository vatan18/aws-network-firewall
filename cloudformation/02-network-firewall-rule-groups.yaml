        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  TrafficPolicyRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${ProjectName}-${Environment}-sf-traffic-policy"
      Description: Customer-managed ingress, east-west and egress port/CIDR rules, plus QUIC handling.
      Type: STATEFUL
      Capacity: !Ref SuricataCapacity
      RuleGroup:
        RuleVariables:
          IPSets:
            INGRESS_SOURCES:
              Definition: !Ref IngressAllowedSourceCidrs
            EGRESS_DESTS:
              Definition: !If [HasEgressCidrs, !Ref EgressAllowedDestinationCidrs, ["192.0.2.255/32"]]
          PortSets:
            INGRESS_TCP_PORTS:
              Definition: !If [HasIngressTcp, !Ref IngressAllowedTcpPorts, ["65535"]]
            INGRESS_UDP_PORTS:
              Definition: !If [HasIngressUdp, !Ref IngressAllowedUdpPorts, ["65535"]]
            EGRESS_TCP_PORTS:
              Definition: !If [HasEgressTcp, !Ref EgressAllowedTcpPorts, ["65535"]]
            EGRESS_UDP_PORTS:
              Definition: !If [HasEgressUdp, !Ref EgressAllowedUdpPorts, ["65535"]]
            EW_TCP_PORTS:
              Definition: !If [EastWestPortsOnly, !Ref EastWestAllowedTcpPorts, ["65535"]]
        RulesSource:
          RulesString: !Join
            - "\n"
            - - !If [IngressOpen, 'pass ip any any -> $HOME_NET any (msg:"anfw: ingress open mode"; sid:1000401; rev:1;)', ""]
              - !If [HasIngressTcp, 'pass tcp $INGRESS_SOURCES any -> $HOME_NET $INGRESS_TCP_PORTS (msg:"anfw: ingress tcp allowed"; flow:to_server; sid:1000402; rev:1;)', ""]
              - !If [HasIngressUdp, 'pass udp $INGRESS_SOURCES any -> $HOME_NET $INGRESS_UDP_PORTS (msg:"anfw: ingress udp allowed"; flow:to_server; sid:1000403; rev:1;)', ""]
              - !If [EastWestAllowAll, 'pass ip $HOME_NET any -> $HOME_NET any (msg:"anfw: east-west allowed"; sid:1000404; rev:1;)', ""]
              - !If [EastWestPortsOnly, 'pass tcp $HOME_NET any -> $HOME_NET $EW_TCP_PORTS (msg:"anfw: east-west tcp port allowed"; flow:to_server; sid:1000405; rev:1;)', ""]
              - !If [HasEgressTcp, 'pass tcp $HOME_NET any -> any $EGRESS_TCP_PORTS (msg:"anfw: approved egress tcp port"; flow:to_server; sid:1000406; rev:1;)', ""]
              - !If [HasEgressUdp, 'pass udp $HOME_NET any -> any $EGRESS_UDP_PORTS (msg:"anfw: approved egress udp port"; flow:to_server; sid:1000407; rev:1;)', ""]
              - !If [HasEgressCidrs, 'pass ip $HOME_NET any -> $EGRESS_DESTS any (msg:"anfw: approved egress destination"; sid:1000408; rev:1;)', ""]
              - !If [BlockQuicOn, 'drop udp $HOME_NET any -> any 443 (msg:"anfw: QUIC/HTTP3 blocked so domain rules apply"; flow:to_server; sid:1000409; rev:1;)', ""]
              - !If [ApplyIngressDrop, 'drop tcp any any -> $HOME_NET any (msg:"anfw: inbound tcp not allowed"; flow:to_server; sid:1000410; rev:1;)', ""]
              - !If [ApplyIngressDrop, 'drop udp any any -> $HOME_NET any (msg:"anfw: inbound udp not allowed"; flow:to_server; sid:1000411; rev:1;)', ""]
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

Outputs:
  StatelessBaselineRuleGroupArn:
    Description: Stateless baseline ARN (empty when disabled).
    Value: !If [CreateStatelessBaseline, !GetAtt StatelessBaselineRuleGroup.RuleGroupArn, ""]
    Export: { Name: !Sub "${AWS::StackName}-StatelessBaselineRuleGroupArn" }
  IpDenylistRuleGroupArn:
    Value: !GetAtt IpDenylistRuleGroup.RuleGroupArn
    Export: { Name: !Sub "${AWS::StackName}-IpDenylistRuleGroupArn" }
  DomainDenylistRuleGroupArn:
    Value: !GetAtt DomainDenylistRuleGroup.RuleGroupArn
    Export: { Name: !Sub "${AWS::StackName}-DomainDenylistRuleGroupArn" }
  DomainAllowlistRuleGroupArn:
    Value: !GetAtt DomainAllowlistRuleGroup.RuleGroupArn
    Export: { Name: !Sub "${AWS::StackName}-DomainAllowlistRuleGroupArn" }
  AdminAccessRuleGroupArn:
    Value: !GetAtt AdminAccessRuleGroup.RuleGroupArn
    Export: { Name: !Sub "${AWS::StackName}-AdminAccessRuleGroupArn" }
  DnsSecurityRuleGroupArn:
    Value: !GetAtt DnsSecurityRuleGroup.RuleGroupArn
    Export: { Name: !Sub "${AWS::StackName}-DnsSecurityRuleGroupArn" }
  IpsSignaturesRuleGroupArn:
    Value: !GetAtt IpsSignaturesRuleGroup.RuleGroupArn
    Export: { Name: !Sub "${AWS::StackName}-IpsSignaturesRuleGroupArn" }
  PresetAllowRuleGroupArn:
    Value: !GetAtt PresetAllowRuleGroup.RuleGroupArn
    Export: { Name: !Sub "${AWS::StackName}-PresetAllowRuleGroupArn" }
  PresetBlockRuleGroupArn:
    Value: !GetAtt PresetBlockRuleGroup.RuleGroupArn
    Export: { Name: !Sub "${AWS::StackName}-PresetBlockRuleGroupArn" }
  TrafficPolicyRuleGroupArn:
    Value: !GetAtt TrafficPolicyRuleGroup.RuleGroupArn
    Export: { Name: !Sub "${AWS::StackName}-TrafficPolicyRuleGroupArn" }
