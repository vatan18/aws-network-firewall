AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Master (parent) stack for the AWS Network Firewall POC: logging/KMS (08), rule groups (02),
  policy (03) and firewall (04) as nested stacks. Package with `aws cloudformation package`
  (see scripts/deploy.sh) so the relative TemplateURL values are uploaded to S3.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming and tagging }
        Parameters: [ProjectName, Environment, Owner, CostCenter]
      - Label: { default: Placement }
        Parameters: [VpcId, AvailabilityZoneCount, AvailabilityZones, FirewallSubnetIds]
      - Label: { default: Rollout }
        Parameters: [EnforcementMode, StreamExceptionPolicy, HomeNetCidrs]
      - Label: { default: Rule inputs }
        Parameters: [DomainAllowlist, DomainDenylist, BlockedIpCidrs, AdminAllowedCidrs, SshEgressAllowedCidrs, AllowedDnsResolverCidrs]
      - Label: { default: Egress control }
        Parameters: [EgressMode, BlockQuic, EgressAllowedTcpPorts, EgressAllowedUdpPorts, EgressAllowedDestinationCidrs]
      - Label: { default: Ingress control }
        Parameters: [IngressMode, IngressAllowedSourceCidrs, IngressAllowedTcpPorts, IngressAllowedUdpPorts]
      - Label: { default: East-west control }
        Parameters: [EastWestMode, EastWestAllowedTcpPorts]
      - Label: { default: Application presets }
        Parameters: [PresetGoogle, PresetYouTube, PresetFacebook, PresetInstagram, PresetWhatsApp, PresetX, PresetLinkedIn, PresetTikTok, PresetMicrosoft365, PresetNetflix]
      - Label: { default: Protection }
        Parameters: [DeleteProtection, FirewallPolicyChangeProtection, SubnetChangeProtection]
      - Label: { default: Logging and alarms }
        Parameters: [ExistingKmsKeyArn, LogRetentionDays, AlarmEmail, PathHealthMissingDataTreatment]

Parameters:
  ProjectName:
    Type: String
    Default: anfw
    Description: Short project prefix used in resource names.
    AllowedPattern: '^[a-z][a-z0-9-]{1,14}$'
  Environment:
    Type: String
    Default: poc
    AllowedValues: [poc, dev, stg, prod]
    Description: Deployment environment.
  Owner:
    Type: String
    Default: platform-team
    Description: Owner tag value.
    AllowedPattern: '^[A-Za-z0-9 ._@:/=+-]{1,128}$'
  CostCenter:
    Type: String
    Default: infra-security
    Description: CostCenter tag value.
    AllowedPattern: '^[A-Za-z0-9 ._@:/=+-]{1,128}$'
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that hosts the firewall endpoints.
  AvailabilityZoneCount:
    Type: String
    Default: "2"
    AllowedValues: ["2", "3"]
    Description: Number of AZs (and firewall subnets).
  AvailabilityZones:
    Type: CommaDelimitedList
    Default: "ap-south-1a,ap-south-1b"
    Description: AZ names, in the same order as FirewallSubnetIds.
  FirewallSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Dedicated firewall subnets, one per AZ, same order as AvailabilityZones.
  EnforcementMode:
    Type: String
    Default: alert
    AllowedValues: [alert, drop]
    Description: alert = observe only. drop = enforce. Start with alert, review logs, then switch.
  StreamExceptionPolicy:
    Type: String
    Default: DROP
    AllowedValues: [DROP, REJECT, CONTINUE]
    Description: Use CONTINUE while observing an existing VPC, DROP once routing symmetry is proven.
  HomeNetCidrs:
    Type: CommaDelimitedList
    Default: ""
    Description: Optional HOME_NET override (required for centralized inspection of multiple VPCs).
    AllowedPattern: '^$|^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  DomainAllowlist:
    Type: CommaDelimitedList
    Default: ".amazonaws.com,.github.com,.githubusercontent.com,.docker.io,.docker.com,registry.k8s.io,.ubuntu.com"
    Description: Approved egress domains.
    AllowedPattern: '^[.a-zA-Z0-9,_-]+$'
  DomainDenylist:
    Type: CommaDelimitedList
    Default: ".wicar.org,.eicar.org"
    Description: Always-blocked domains.
    AllowedPattern: '^[.a-zA-Z0-9,_-]+$'
  BlockedIpCidrs:
    Type: CommaDelimitedList
    Default: "192.0.2.0/24"
    Description: Blocked IPv4 CIDRs.
    AllowedPattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  AdminAllowedCidrs:
    Type: CommaDelimitedList
    Default: "198.51.100.0/24"
    Description: Sources allowed to SSH/RDP into HOME_NET.
    AllowedPattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  SshEgressAllowedCidrs:
    Type: CommaDelimitedList
    Default: "203.0.113.0/24"
    Description: Approved SSH egress destinations.
    AllowedPattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  AllowedDnsResolverCidrs:
    Type: CommaDelimitedList
    Default: "10.0.0.2/32"
    Description: Approved DNS resolvers reachable through the firewall.
    AllowedPattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  DeleteProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Firewall deletion protection (true for production).
  FirewallPolicyChangeProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Policy association change protection (true for production).
  SubnetChangeProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Subnet association change protection (true for production).
  ExistingKmsKeyArn:
    Type: String
    Default: ""
    Description: Optional existing KMS key ARN; empty creates a CMK.
    AllowedPattern: '^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]{36}$'
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch Logs retention.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional alarm e-mail address.
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
  PathHealthMissingDataTreatment:
    Type: String
    Default: notBreaching
    AllowedValues: [breaching, notBreaching, ignore, missing]
    Description: Use breaching in production.

  PresetGoogle:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Google preset (.google.com, .google.co.in, .gstatic.com, .googleusercontent.com). none = no rule, allow = permit, block = deny."
  PresetYouTube:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "YouTube preset (.youtube.com, .youtu.be, .googlevideo.com, .ytimg.com, .youtube-nocookie.com). none = no rule, allow = permit, block = deny."
  PresetFacebook:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Facebook preset (.facebook.com, .facebook.net, .fbcdn.net, .fb.com, .fbsbx.com). none = no rule, allow = permit, block = deny."
  PresetInstagram:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Instagram preset (.instagram.com, .cdninstagram.com). none = no rule, allow = permit, block = deny."
  PresetWhatsApp:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "WhatsApp preset (.whatsapp.com, .whatsapp.net). none = no rule, allow = permit, block = deny."
  PresetX:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "X preset (.twitter.com, .x.com, .twimg.com, .t.co). none = no rule, allow = permit, block = deny."
  PresetLinkedIn:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "LinkedIn preset (.linkedin.com, .licdn.com). none = no rule, allow = permit, block = deny."
  PresetTikTok:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "TikTok preset (.tiktok.com, .tiktokcdn.com, .tiktokv.com, .byteoversea.com). none = no rule, allow = permit, block = deny."
  PresetMicrosoft365:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Microsoft365 preset (.microsoft.com, .office.com, .office365.com, .microsoftonline.com, .live.com, .sharepoint.com, .outlook.com). none = no rule, allow = permit, block = deny."
  PresetNetflix:
    Type: String
    Default: none
    AllowedValues: [none, allow, block]
    Description: "Netflix preset (.netflix.com, .nflxvideo.net, .nflximg.net, .nflxso.net, .nflxext.com). none = no rule, allow = permit, block = deny."
  BlockQuic:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Drop outbound QUIC (UDP 443) so domain rules apply to Google/YouTube traffic.
  EgressMode:
    Type: String
    Default: allowlist
    AllowedValues: [allowlist, open]
    Description: allowlist = default-deny outbound; open = default-allow except blocked.
  EgressAllowedTcpPorts:
    Type: CommaDelimitedList
    Default: ""
    Description: Outbound TCP ports allowed to any destination. Empty = none.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'
  EgressAllowedUdpPorts:
    Type: CommaDelimitedList
    Default: "123"
    Description: Outbound UDP ports allowed to any destination.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'
  EgressAllowedDestinationCidrs:
    Type: CommaDelimitedList
    Default: ""
    Description: Destination CIDRs reachable on any port. Empty = none.
    AllowedPattern: '^$|^([0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  IngressMode:
    Type: String
    Default: restricted
    AllowedValues: [restricted, open]
    Description: restricted = only listed sources/ports inbound; open = all inbound after threat checks.
  IngressAllowedSourceCidrs:
    Type: CommaDelimitedList
    Default: "0.0.0.0/0"
    Description: Sources allowed inbound on the allowed ports.
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}(,[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2})*$'
  IngressAllowedTcpPorts:
    Type: CommaDelimitedList
    Default: "80,443"
    Description: Inbound TCP ports allowed.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'
  IngressAllowedUdpPorts:
    Type: CommaDelimitedList
    Default: ""
    Description: Inbound UDP ports allowed.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'
  EastWestMode:
    Type: String
    Default: allow-all
    AllowedValues: [allow-all, ports-only]
    Description: East-west policy inside HOME_NET.
  EastWestAllowedTcpPorts:
    Type: CommaDelimitedList
    Default: ""
    Description: East-west TCP ports allowed when ports-only.
    AllowedPattern: '^$|^([0-9]{1,5}(:[0-9]{1,5})?)(,[0-9]{1,5}(:[0-9]{1,5})?)*$'

Resources:
  LoggingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./08-logging-monitoring.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        Owner: !Ref Owner
        CostCenter: !Ref CostCenter
        FirewallName: !Sub "${ProjectName}-${Environment}-fw"
        AvailabilityZoneCount: !Ref AvailabilityZoneCount
        AvailabilityZones: !Join [",", !Ref AvailabilityZones]
        ExistingKmsKeyArn: !Ref ExistingKmsKeyArn
        LogRetentionDays: !Ref LogRetentionDays
        AlarmEmail: !Ref AlarmEmail
        PathHealthMissingDataTreatment: !Ref PathHealthMissingDataTreatment

  RuleGroupsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./02-network-firewall-rule-groups.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        Owner: !Ref Owner
        CostCenter: !Ref CostCenter
        DomainAllowlist: !Join [",", !Ref DomainAllowlist]
        DomainDenylist: !Join [",", !Ref DomainDenylist]
        BlockedIpCidrs: !Join [",", !Ref BlockedIpCidrs]
        AdminAllowedCidrs: !Join [",", !Ref AdminAllowedCidrs]
        SshEgressAllowedCidrs: !Join [",", !Ref SshEgressAllowedCidrs]
        AllowedDnsResolverCidrs: !Join [",", !Ref AllowedDnsResolverCidrs]
        PresetGoogle: !Ref PresetGoogle
        PresetYouTube: !Ref PresetYouTube
        PresetFacebook: !Ref PresetFacebook
        PresetInstagram: !Ref PresetInstagram
        PresetWhatsApp: !Ref PresetWhatsApp
        PresetX: !Ref PresetX
        PresetLinkedIn: !Ref PresetLinkedIn
        PresetTikTok: !Ref PresetTikTok
        PresetMicrosoft365: !Ref PresetMicrosoft365
        PresetNetflix: !Ref PresetNetflix
        BlockQuic: !Ref BlockQuic
        EgressMode: !Ref EgressMode
        IngressMode: !Ref IngressMode
        EastWestMode: !Ref EastWestMode
        EgressAllowedTcpPorts: !Join [",", !Ref EgressAllowedTcpPorts]
        EgressAllowedUdpPorts: !Join [",", !Ref EgressAllowedUdpPorts]
        EgressAllowedDestinationCidrs: !Join [",", !Ref EgressAllowedDestinationCidrs]
        IngressAllowedSourceCidrs: !Join [",", !Ref IngressAllowedSourceCidrs]
        IngressAllowedTcpPorts: !Join [",", !Ref IngressAllowedTcpPorts]
        IngressAllowedUdpPorts: !Join [",", !Ref IngressAllowedUdpPorts]
        EastWestAllowedTcpPorts: !Join [",", !Ref EastWestAllowedTcpPorts]

  PolicyStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./03-network-firewall-policy.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        Owner: !Ref Owner
        CostCenter: !Ref CostCenter
        EnforcementMode: !Ref EnforcementMode
        StreamExceptionPolicy: !Ref StreamExceptionPolicy
        HomeNetCidrs: !Join [",", !Ref HomeNetCidrs]
        StatelessBaselineRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.StatelessBaselineRuleGroupArn
        IpDenylistRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.IpDenylistRuleGroupArn
        DomainDenylistRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.DomainDenylistRuleGroupArn
        DomainAllowlistRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.DomainAllowlistRuleGroupArn
        AdminAccessRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.AdminAccessRuleGroupArn
        DnsSecurityRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.DnsSecurityRuleGroupArn
        IpsSignaturesRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.IpsSignaturesRuleGroupArn
        EgressMode: !Ref EgressMode
        PresetAllowRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.PresetAllowRuleGroupArn
        PresetBlockRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.PresetBlockRuleGroupArn
        TrafficPolicyRuleGroupArn: !GetAtt RuleGroupsStack.Outputs.TrafficPolicyRuleGroupArn

  FirewallStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./04-network-firewall-deployment.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        Owner: !Ref Owner
        CostCenter: !Ref CostCenter
        VpcId: !Ref VpcId
        FirewallSubnetCount: !Ref AvailabilityZoneCount
        FirewallSubnetIds: !Join [",", !Ref FirewallSubnetIds]
        FirewallPolicyArn: !GetAtt PolicyStack.Outputs.FirewallPolicyArn
        DeleteProtection: !Ref DeleteProtection
        FirewallPolicyChangeProtection: !Ref FirewallPolicyChangeProtection
        SubnetChangeProtection: !Ref SubnetChangeProtection
        AlertLogGroupName: !GetAtt LoggingStack.Outputs.AlertLogGroupName
        ArchiveBucketName: !GetAtt LoggingStack.Outputs.ArchiveBucketName
        FlowLogPrefix: !GetAtt LoggingStack.Outputs.FlowLogPrefix

Outputs:
  FirewallArn:
    Value: !GetAtt FirewallStack.Outputs.FirewallArn
  FirewallName:
    Value: !GetAtt FirewallStack.Outputs.FirewallName
  EndpointIds:
    Description: az:vpce-id pairs for routing (template 05).
    Value: !GetAtt FirewallStack.Outputs.EndpointIds
  FirewallPolicyArn:
    Value: !GetAtt PolicyStack.Outputs.FirewallPolicyArn
  AlertLogGroupName:
    Value: !GetAtt LoggingStack.Outputs.AlertLogGroupName
  ArchiveBucketName:
    Value: !GetAtt LoggingStack.Outputs.ArchiveBucketName
  AlarmTopicArn:
    Value: !GetAtt LoggingStack.Outputs.AlarmTopicArn
