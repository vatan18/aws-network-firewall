AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  08 - Logging and monitoring foundation for AWS Network Firewall: KMS CMK (or BYO key),
  CloudWatch alert log group, S3 flow-log archive, SNS alarm topic, CloudWatch alarms,
  log metric filter and dashboard. Deploy BEFORE the firewall (04).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming and tagging }
        Parameters: [ProjectName, Environment, Owner, CostCenter, FirewallName]
      - Label: { default: Availability Zones (alarm and dashboard scope) }
        Parameters: [AvailabilityZoneCount, AvailabilityZones]
      - Label: { default: Encryption and retention }
        Parameters: [ExistingKmsKeyArn, LogRetentionDays, ArchiveTransitionDays, ArchiveExpirationDays, FlowLogPrefix]
      - Label: { default: Alarms }
        Parameters: [AlarmEmail, PathHealthMinPackets, PathHealthEvaluationPeriods, PathHealthMissingDataTreatment, BlockedAlertThreshold]

Parameters:
  ProjectName:
    Type: String
    Default: anfw
    Description: Short project prefix used in resource names (lowercase letters, digits, hyphens).
    AllowedPattern: '^[a-z][a-z0-9-]{1,14}$'
    ConstraintDescription: 2-15 chars, lowercase, starts with a letter.
  Environment:
    Type: String
    Default: poc
    AllowedValues: [poc, dev, stg, prod]
    Description: Deployment environment.
  Owner:
    Type: String
    Default: platform-team
    Description: Owner tag value.
    AllowedPattern: '^[A-Za-z0-9 ._@:/=+-]{1,128}$'
  CostCenter:
    Type: String
    Default: infra-security
    Description: CostCenter tag value.
    AllowedPattern: '^[A-Za-z0-9 ._@:/=+-]{1,128}$'
  FirewallName:
    Type: String
    Default: anfw-poc-fw
    Description: Name of the Network Firewall these alarms and the dashboard watch. Must match template 04.
    AllowedPattern: '^[a-zA-Z0-9-]{1,128}$'
  AvailabilityZoneCount:
    Type: String
    Default: "2"
    AllowedValues: ["2", "3"]
    Description: Number of AZs with a firewall endpoint.
  AvailabilityZones:
    Type: CommaDelimitedList
    Default: "ap-south-1a,ap-south-1b"
    Description: AZ names (not IDs) of the firewall endpoints, in the same order as the firewall subnets.
  ExistingKmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      Optional existing KMS key ARN. Leave empty to create a CMK with a key policy for CloudWatch Logs,
      log delivery and CloudWatch alarms. A BYO key policy must grant the same service principals.
    AllowedPattern: '^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]{36}$'
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch Logs retention for alert logs.
  ArchiveTransitionDays:
    Type: Number
    Default: 30
    MinValue: 30
    Description: Days before S3 flow logs move to STANDARD_IA (minimum 30).
  ArchiveExpirationDays:
    Type: Number
    Default: 365
    MinValue: 31
    Description: Days before S3 flow logs expire.
  FlowLogPrefix:
    Type: String
    Default: network-firewall
    Description: S3 key prefix for Network Firewall logs (no leading or trailing slash).
    AllowedPattern: '^[a-zA-Z0-9][a-zA-Z0-9/_-]{0,63}$'
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional e-mail address subscribed to the alarm topic (must confirm the subscription).
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
  PathHealthMinPackets:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Alarm if packets received by the stateless engine in an AZ fall below this per period.
  PathHealthEvaluationPeriods:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Number of 5-minute periods below threshold before the path-health alarm fires.
  PathHealthMissingDataTreatment:
    Type: String
    Default: notBreaching
    AllowedValues: [breaching, notBreaching, ignore, missing]
    Description: Use notBreaching for idle labs. Use breaching in production so a silent endpoint alarms.
  BlockedAlertThreshold:
    Type: Number
    Default: 50
    MinValue: 1
    Description: Blocked-alert count per 5 minutes that triggers the spike alarm.

Conditions:
  CreateKey: !Equals [!Ref ExistingKmsKeyArn, ""]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasThirdAz: !Equals [!Ref AvailabilityZoneCount, "3"]

Resources:
  # ---------------------------------------------------------------- KMS
  LogsKey:
    Type: AWS::KMS::Key
    Condition: CreateKey
    DeletionPolicy: Retain          # archived logs stay readable after stack deletion
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${ProjectName}-${Environment} Network Firewall logs, archive and alarm topic encryption"
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIamPermissionsForAccount
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsEncryptionScopedToLogGroups
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
          - Sid: AllowLogDeliveryToEncryptedS3
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
          - Sid: AllowCloudWatchAlarmsToPublishToEncryptedTopic
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-nfw-logs-key" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  LogsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateKey
    Properties:
      AliasName: !Sub "alias/${ProjectName}-${Environment}-nfw-logs"
      TargetKeyId: !Ref LogsKey

  # ---------------------------------------------------------------- CloudWatch Logs
  AlertLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/network-firewall/${ProjectName}-${Environment}/alert"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If [CreateKey, !GetAtt LogsKey.Arn, !Ref ExistingKmsKeyArn]
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  BlockedAlertMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AlertLogGroup
      FilterPattern: '{ $.event.alert.action = "blocked" }'
      MetricTransformations:
        - MetricNamespace: !Sub "${ProjectName}/${Environment}/NetworkFirewall"
          MetricName: BlockedAlerts
          MetricValue: "1"
          DefaultValue: 0

  # ---------------------------------------------------------------- S3 archive
  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-nfw-logs-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !If [CreateKey, !GetAtt LogsKey.Arn, !Ref ExistingKmsKeyArn]
      LifecycleConfiguration:
        Rules:
          - Id: archive-then-expire
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: !Ref ArchiveTransitionDays
            ExpirationInDays: !Ref ArchiveExpirationDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArchiveBucket.Arn
              - !Sub "${ArchiveBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: AllowLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: "s3:PutObject"
            Resource: !Sub "${ArchiveBucket.Arn}/${FlowLogPrefix}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                "s3:x-amz-acl": bucket-owner-full-control
                "aws:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
          - Sid: AllowLogDeliveryAclCheck
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: "s3:GetBucketAcl"
            Resource: !GetAtt ArchiveBucket.Arn
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  # ---------------------------------------------------------------- Alarm plumbing
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-nfw-alarms"
      KmsMasterKeyId: !If [CreateKey, !GetAtt LogsKey.Arn, !Ref ExistingKmsKeyArn]
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: ManagedBy, Value: CloudFormation }

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: "sns:Publish"
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # ---------------------------------------------------------------- Alarms
  BlockedAlertSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${FirewallName}-blocked-alert-spike"
      AlarmDescription: Blocked-traffic alerts exceeded the threshold in 5 minutes. Check the alert log group and dashboard.
      Namespace: !Sub "${ProjectName}/${Environment}/NetworkFirewall"
      MetricName: BlockedAlerts
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref BlockedAlertThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  PathHealthAlarmAz1:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ["-", [!Ref FirewallName, path-health, !Select [0, !Ref AvailabilityZones]]]
      AlarmDescription: Stateless engine received too few packets in this AZ. Possible endpoint failure, route change or traffic loss.
      Namespace: AWS/NetworkFirewall
      MetricName: ReceivedPackets
      Dimensions:
        - { Name: FirewallName, Value: !Ref FirewallName }
        - { Name: AvailabilityZone, Value: !Select [0, !Ref AvailabilityZones] }
        - { Name: Engine, Value: Stateless }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref PathHealthEvaluationPeriods
      Threshold: !Ref PathHealthMinPackets
      ComparisonOperator: LessThanThreshold
      TreatMissingData: !Ref PathHealthMissingDataTreatment
      AlarmActions: [!Ref AlarmTopic]

  PathHealthAlarmAz2:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ["-", [!Ref FirewallName, path-health, !Select [1, !Ref AvailabilityZones]]]
      AlarmDescription: Stateless engine received too few packets in this AZ. Possible endpoint failure, route change or traffic loss.
      Namespace: AWS/NetworkFirewall
      MetricName: ReceivedPackets
      Dimensions:
        - { Name: FirewallName, Value: !Ref FirewallName }
        - { Name: AvailabilityZone, Value: !Select [1, !Ref AvailabilityZones] }
        - { Name: Engine, Value: Stateless }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref PathHealthEvaluationPeriods
      Threshold: !Ref PathHealthMinPackets
      ComparisonOperator: LessThanThreshold
      TreatMissingData: !Ref PathHealthMissingDataTreatment
      AlarmActions: [!Ref AlarmTopic]

  PathHealthAlarmAz3:
    Type: AWS::CloudWatch::Alarm
    Condition: HasThirdAz
    Properties:
      AlarmName: !Join ["-", [!Ref FirewallName, path-health, !Select [2, !Ref AvailabilityZones]]]
      AlarmDescription: Stateless engine received too few packets in this AZ. Possible endpoint failure, route change or traffic loss.
      Namespace: AWS/NetworkFirewall
      MetricName: ReceivedPackets
      Dimensions:
        - { Name: FirewallName, Value: !Ref FirewallName }
        - { Name: AvailabilityZone, Value: !Select [2, !Ref AvailabilityZones] }
        - { Name: Engine, Value: Stateless }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref PathHealthEvaluationPeriods
      Threshold: !Ref PathHealthMinPackets
      ComparisonOperator: LessThanThreshold
      TreatMissingData: !Ref PathHealthMissingDataTreatment
      AlarmActions: [!Ref AlarmTopic]

  # ---------------------------------------------------------------- Dashboard
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-${Environment}-network-firewall"
      DashboardBody: !Sub
        - |
          {"widgets":[
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Dropped packets (stateful engine) per AZ","region":"${AWS::Region}","view":"timeSeries","stat":"Sum","period":60,"metrics":[
              ["AWS/NetworkFirewall","DroppedPackets","FirewallName","${FirewallName}","AvailabilityZone","${Az1}","Engine","Stateful"],
              ["AWS/NetworkFirewall","DroppedPackets","FirewallName","${FirewallName}","AvailabilityZone","${Az2}","Engine","Stateful"]${Az3Dropped}]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Packets received (stateless engine) per AZ - path health","region":"${AWS::Region}","view":"timeSeries","stat":"Sum","period":60,"metrics":[
              ["AWS/NetworkFirewall","ReceivedPackets","FirewallName","${FirewallName}","AvailabilityZone","${Az1}","Engine","Stateless"],
              ["AWS/NetworkFirewall","ReceivedPackets","FirewallName","${FirewallName}","AvailabilityZone","${Az2}","Engine","Stateless"]${Az3Received}]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Blocked alerts (from alert log metric filter)","region":"${AWS::Region}","view":"timeSeries","stat":"Sum","period":60,"metrics":[
              ["${ProjectName}/${Environment}/NetworkFirewall","BlockedAlerts"]]}},
            {"type":"log","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Top blocked signatures","region":"${AWS::Region}","view":"table",
              "query":"SOURCE '${AlertLogGroup}' | filter event.alert.action = 'blocked' | stats count(*) as hits by event.alert.signature | sort hits desc | limit 20"}},
            {"type":"log","x":0,"y":12,"width":24,"height":8,"properties":{"title":"Recent blocked events","region":"${AWS::Region}","view":"table",
              "query":"SOURCE '${AlertLogGroup}' | fields @timestamp, event.src_ip, event.dest_ip, event.dest_port, event.proto, event.alert.signature | filter event.alert.action = 'blocked' | sort @timestamp desc | limit 50"}}
          ]}
        - Az1: !Select [0, !Ref AvailabilityZones]
          Az2: !Select [1, !Ref AvailabilityZones]
          Az3Dropped: !If
            - HasThirdAz
            - !Sub
              - ',["AWS/NetworkFirewall","DroppedPackets","FirewallName","${FirewallName}","AvailabilityZone","${AzThree}","Engine","Stateful"]'
              - AzThree: !Select [2, !Ref AvailabilityZones]
            - ""
          Az3Received: !If
            - HasThirdAz
            - !Sub
              - ',["AWS/NetworkFirewall","ReceivedPackets","FirewallName","${FirewallName}","AvailabilityZone","${AzThree}","Engine","Stateless"]'
              - AzThree: !Select [2, !Ref AvailabilityZones]
            - ""

Outputs:
  KmsKeyArn:
    Description: KMS key protecting logs, archive and alarm topic.
    Value: !If [CreateKey, !GetAtt LogsKey.Arn, !Ref ExistingKmsKeyArn]
    Export: { Name: !Sub "${AWS::StackName}-KmsKeyArn" }
  AlertLogGroupName:
    Description: CloudWatch Logs group for ALERT logs.
    Value: !Ref AlertLogGroup
    Export: { Name: !Sub "${AWS::StackName}-AlertLogGroupName" }
  ArchiveBucketName:
    Description: S3 bucket for FLOW log archive.
    Value: !Ref ArchiveBucket
    Export: { Name: !Sub "${AWS::StackName}-ArchiveBucketName" }
  FlowLogPrefix:
    Description: S3 prefix configured on the bucket policy.
    Value: !Ref FlowLogPrefix
  AlarmTopicArn:
    Description: SNS topic receiving alarm notifications.
    Value: !Ref AlarmTopic
    Export: { Name: !Sub "${AWS::StackName}-AlarmTopicArn" }
